  - id: ts-concat-first-person
    languages: [typescript]
    severity: ERROR
    message: >-
      First person plural reassembled from a `+` chain of literals. #1287:
      unlike the four siblings above, this one requires the join to fall
      inside the word's own letters (`w`|`e`, `o`|`ur`, `ou`|`r`, and each
      internal split of `let's`) rather than making every letter-boundary
      optional -- an optional join at every position also matches a whole
      word sitting untouched inside one literal of an unrelated `+` chain,
      which is what produced 9 false positives (`"...own We" + "bGL..."`)
      when tried the same way as the other three. See this file's header
      comment for why `we`/`our`/`let's` needed a different construction.
    paths:
      exclude:
        - "**/gen/**"
    patterns:
      - pattern-regex: "(?:\"(?:[^\"\\\\\\n]|\\\\.)*\"|`(?:[^`\\\\]|\\\\.)*`|'(?:[^'\\\\\\n]|\\\\.)*')(?:\\s*\\+\\s*(?:\"(?:[^\"\\\\\\n]|\\\\.)*\"|`(?:[^`\\\\]|\\\\.)*`|'(?:[^'\\\\\\n]|\\\\.)*'))+"
