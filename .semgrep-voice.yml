    patterns:
      - pattern-regex: "(?m)^\\s*//(?:[^`\"\\n]|`[^`\\n]*`|\"[^\"\\n]*\")*?\\b(?:at a glance|under the hood|drill down|deep dive|unlock|powerful|seamless|robust|rich|intuitive|elegant|first-class|out of the box|heavy lifting|source of truth|north star|helps you|lets you|allows you to|makes it easy to|so you can|designed to|built to|simply|just|essentially|basically|actually|really|quite|fairly|generally|typically|various|appropriate|as needed|please note|of course|note that|in order to|it should be noted|right now|at the moment|we|our|let's)\\b"

  # CSS has no `//` line comment, only `/* ... */`, and manifold's
  # `tokens.css`/`globals.css` carry this tree's only substantial CSS
  # prose (reasoning for a colour ramp, a WCAG citation, a cross-file
  # duplication note) -- manifold is fully bound, not part of `CLAUDE.md`'s
  # rendered-copy carve-out. `drill-down` (hyphenated, naming the table's
  # own expand control) does not match `drill down` (spaced, the banned
  # verb phrase) by construction; no exclusion was needed for it.
  - id: css-comment-authored-voice
    languages: [generic]
    severity: ERROR
    message: >-
      Banned wording in a CSS comment. VOICE.md § Banned outright applies to
      everything a human reads, comments included.
    paths:
      include:
        - "*.css"
    patterns:
      - pattern-regex: "/\\*(?:[^*`]|\\*(?!/)|`[^`]*`)*?\\b(?:at a glance|under the hood|drill down|deep dive|unlock|powerful|seamless|robust|rich|intuitive|elegant|first-class|out of the box|heavy lifting|source of truth|north star|helps you|lets you|allows you to|makes it easy to|so you can|designed to|built to|simply|just|essentially|basically|actually|really|quite|fairly|generally|typically|various|appropriate|as needed|please note|of course|note that|in order to|it should be noted|right now|at the moment|we|our|let's)\\b(?:[^*`]|\\*(?!/)|`[^`]*`)*?\\*/"
