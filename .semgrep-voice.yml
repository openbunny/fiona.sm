  # toml-comment-authored-voice, yaml-comment-authored-voice, sh-comment-authored-voice
  # and justfile-comment-authored-voice share one shape: `# ...` from a
  # comment-only line, `finance/justfile`'s own `--` skipped, past a
  # complete same-line backtick or double-quoted span (this tree quotes a
  # `just <recipe>` reference in backticks in these files exactly as
  # markdown does; unlike markdown, none of these types measured a
  # multi-line-wrapped comment or a fenced shell example, so neither the
  # md-hedge-just line-initial exclusion nor a blockquote exclusion is
  # needed here). Reduced word list relative to the Rust/TS/markdown
  # rules, matching `hcl-typst-authored-voice` above: figurative minus
  # `clean`/`surface` (never measured a hit in these types) and `smart`
  # (dropped for the same domain-jargon reason as markdown; the same
  # "smart contract" phrasing exists in this tree's config comments),
  # purpose-verb minus `enables` (same Cargo-feature-flag reason as
  # markdown -- `.cargo/mutants.toml` and a `Cargo.toml` both use it that
  # way), no exclamation rule (same measured reason as everywhere else in
  # this file). `.semgrep-voice.yml` and `.semgrep-comments.yml` are
  # excluded from `yaml-comment-authored-voice`: both are, like
  # `docs/VOICE.md`, documents whose comments extensively quote and
  # discuss this file's own banned-word lists as their subject rather
  # than using them, and `.semgrep-comments.yml` belongs to a sibling
  # lane this file does not edit. Six real violations were found and
  # fixed across these four types before this rule was added -- four
  # `actually` hedges in `finance/scripts/*.sh` and
  # `finance/crates/*/tests/probe_*.sh`, one `not just X` each in
  # `deny.toml` and `.cargo/mutants.toml`, one `source of truth` in the
  # root `justfile`, one `not just X` in `compose.yml`, and one `our` each
  # in `deny.toml` and `finance/scripts/verify-minio.sh` -- see the three
  # docs-fix commits on this branch for the rewrites.
  - id: toml-comment-authored-voice
    languages: [generic]
    severity: ERROR
    message: >-
      Banned wording in a TOML comment. VOICE.md § Banned outright applies to
      everything a human reads, comments included.
    paths:
      include:
        - "*.toml"
    patterns:
      - pattern-regex: "(?m)^\\s*#(?:[^`\"\\n]|`[^`\\n]*`|\"[^\"\\n]*\")*?\\b(?:at a glance|under the hood|drill down|deep dive|unlock|powerful|seamless|robust|rich|intuitive|elegant|first-class|out of the box|heavy lifting|source of truth|north star|helps you|lets you|allows you to|makes it easy to|so you can|designed to|built to|simply|just|essentially|basically|actually|really|quite|fairly|generally|typically|various|appropriate|as needed|please note|of course|note that|in order to|it should be noted|right now|at the moment|we|our|let's)\\b"

