      - pattern-regex: "(?i)\\b(simply|just|essentially|basically|actually|really|quite|fairly|generally|typically|various|appropriate|as needed|please note|of course|note that|in order to|it should be noted)\\b"

  - id: proto-comment-figurative
    languages: [generic]
    severity: ERROR
    message: >-
      Figurative language in a proto comment. VOICE.md § Banned outright
      applies to everything a human reads, comments included.
    paths:
      include:
        - "/proto/**/*.proto"
    patterns:
      - pattern-regex: '(?:^|[ \t])//[^\n]*$'
      - pattern-regex: "(?i)\\b(at a glance|under the hood|drill down|deep dive|unlock|powerful|seamless|robust|rich|smart|intuitive|elegant|first-class|out of the box|heavy lifting|source of truth|north star)\\b"

  - id: proto-comment-purpose-verb
    languages: [generic]
    severity: ERROR
    message: >-
      A purpose verb in a proto comment. VOICE.md § Banned outright applies
      to everything a human reads, comments included.
    paths:
      include:
        - "/proto/**/*.proto"
    patterns:
      - pattern-regex: '(?:^|[ \t])//[^\n]*$'
