    patterns:
      - pattern-regex: '(?:"(?:[^"\\\n]|\\.)*"|`(?:[^`\\]|\\.)*`|''(?:[^''\\\n]|\\.)*'')'
      - pattern-regex: "(?i)\\b(we|our|let's)\\b"

  - id: ts-comment-figurative
    languages: [typescript]
    severity: ERROR
    message: >-
