# Carried over verbatim from the finance monorepo this rule set was
# authored for. Every citation of VOICE.md below, including inside a rule's
# own `message:`, points at that file in that source repository; it does not
# exist in this checkout. Resolve a citation here against this repo's own
# AGENTS.md instead.
#
# docs/VOICE.md's banned-word lists, for the parts of that document a rule
# can check without judgment: whether a banned word or phrase appears in text
# a human reads (a string literal, a template literal, or a comment), not
# whether a sentence should have been deleted or a limit exceeded -- those
# stay a reader's job.
#
# Word lists come straight from VOICE.md's "Banned outright" section: the
# purpose-verb and hedge/filler lists in full; "we/our/let's" scoped to
# string and template literals only, because VOICE.md's own reason for
# banning first person plural is about copy the reader sees, and a comment
# reasoning about "we" as engineers is a different sentence than "we"
# addressing the reader. The figurative-language list is in full except
# "clean" and "surface" (as a verb): both are load-bearing domain nouns/verbs
# here ("public read surface", "a transport failure must surface as
# Error::Evm", "clean close", a scratch-database name) far more often than
# they are the banned figure of speech -- measured on this tree, most hits
# for both were exactly that, so neither can be made precise as a semgrep
# rule. Evaluative adjectives (good/bad/high/low/...) and exclamation marks
# are in VOICE.md but not here: "high leverage" and "low price" are literal
# data-surface facts as often as they are opinions, and an exclamation mark
# inside a string is `!` used as Tailwind's important modifier, a non-null
# assertion or `!==` in a code snippet, or `<!doctype` far more often than it
# is punctuation -- measured on this tree, most hits for both were exactly
# that, so neither can be made precise as a semgrep rule. The same measurement
# rules out a blanket ellipsis ban from VOICE.md's punctuation rules: `'…'`
# and `"{}…"`/`"{}..."` are this tree's own truncation marker (grvt, godel,
# perpdexlist, deltatradepro, gains, coinex, mexc, derive, variational,
# mempool, gateio, litecoinspace), which carries information -- the string was
# cut -- the same way `4m old` does, so a regex cannot tell that occurrence
# from the rhetorical trailing-off VOICE.md actually bans.
#
# Three rules below reach past the banned-word lists into mechanically
# checkable structure from VOICE.md's "Hard limits" table. VOICE.md's own
# "Where this binds" and "What this product is" sections state the scope:
# `web/apps/manifold` only, because that is the one product those sections
# describe. The family-office, personal-canary and unrelated-brand sites
# elsewhere under `web/apps/` are not it, and their own `description`
# metadata or "read-only" wording is not this section's concern:
#   - `ts-manifold-column-header-too-long`: a `header: "..."` column
#     definition (`DataTable`'s own idiom, not an HTTP header -- this tree
#     never writes `header: "literal"` for one) longer than the 2-word limit.
#     A `header:` built from a template literal or a named constant is not
#     checked -- its rendered length is not known statically.
#   - `ts-manifold-metadata-description`: a `description` field on the page's
#     `metadata` export. VOICE.md: "Page description: delete it."
#   - `ts-manifold-string-scope-claim`: "read-only"/"viewer" describing the
#     product. VOICE.md: "Do not describe the app as read-only or as a
#     viewer." Not extended to `finance/`, where the same words correctly
#     describe a client's own API access scope (`pacifica`, `lighter`), a
#     different claim about a different thing.
#
# "right now"/"at the moment" join the hedge/filler lists as
# `*-temporal-filler` rules, from VOICE.md's "cut every word that is not the
# fact" table. "yet" and "currently" are in that table too but not here:
# measured on this tree both read overwhelmingly as ordinary prose ("has not
# been asked for anything yet", "not currently listed for trading" quoting a
# venue's own error) rather than the banned filler, so neither is precise
# enough to assert without a reader's judgment.
#
# Like .semgrep-comments.yml, this runs tree-wide (`just voice`). Swift gets
# the same nine rules as Rust and TypeScript (string and comment: figurative,
# purpose-verb, hedge, temporal-filler; plus first-person on strings only, for
# the reason given above) -- only the comment syntax differs, since Swift has
# no `//!` module-doc form to special-case. No Objective-C rule: those three
# files carry no reader-facing string copy or surviving comment (`.semgrep-
# comments.yml`'s objc-*-not-kept rules close that surface outright), so the
# banned-word lists would have nothing to check.
#
# `// nosemgrep: <rule-id> -- <reason>` (`eslint-disable-next-line` equivalent
# is the same comment syntax in TypeScript) opts a line out where the matched
# text is not authored copy -- a vendored label quoted verbatim in a fixture,
# for instance -- same convention the other two semgrep configs use.
#
# `rust-string-concat-literal`/`swift-string-concat-literal` and the four
# `ts-concat-*` rules close #1277: every rule above matches text inside one
# string/template-literal node, so `concat!("po", "werful")` in Rust or
# `"po" + "werful"` in TypeScript reassembles a banned word for the reader
# without ever putting it inside a single node any rule above inspects.
# `concat!` has a legitimate use this tree relies on (`descriptor.rs` reading
# ten `.proto` files into one constant for a test) and cannot be banned
# outright, so the two shapes are closed differently, each measured before
# choosing:
#   - Rust and Swift: measured tree-wide, joining two or more *plain string
#     literals* (no `include_str!`/`env!`/`stringify!` mixed in, so the
#     legitimate `descriptor.rs` use and every user-agent/`Display`-impl
#     `concat!` survive untouched) happens at four sites in Rust and zero in
#     Swift, none of them reader-facing -- a hex constant and two YAML test
#     fixtures wrapped across lines, and a lint name built from three parts.
#     All four were rewritten as one literal (Rust's `\`-newline string
#     continuation wraps a long one across source lines with no join left to
#     hide a split word in), so the shape is banned outright rather than
#     inspected for content.
#   - TypeScript: the same outright ban does not survive measurement --
#     wrapping a long message across several `+`-joined literals for line
#     length is an ordinary idiom here, 21 genuine sites doing exactly that
#     tree-wide (test failure messages, a CSP header, a Playwright assertion).
#     Banning the shape would mean justifying or rewriting all 21, and the
#     next long message written the same ordinary way starts the rule down
#     the road #1234 already named: a check every author learns to route
#     around, which then enforces nothing. So the four `ts-concat-*` rules
#     check what a `+` chain of literals actually reassembles instead of its
#     shape: each re-derives the matching `ts-string-*` rule's banned-word
#     regex with an optional `["'`]\s*\+\s*["'`]` joint threaded between every
#     character, so the word matches whether the source spelled it whole or
#     split it at any point along the chain -- one split, ten, it makes no
#     difference to the regex. Verified against every real `+` chain in this
#     tree: zero matches, so the 21 genuine sites stay green. `we`/`our`/
#     `let's` needed a different construction (#1287): two- and three-letter
#     words are short enough that an ordinary line-wrapped sentence spells one
#     by coincidence at the exact join point when every letter-boundary is an
#     optional join the same way the four rules above do it (measured: 9 false
#     positives, e.g. `"...is TensorField's own We" + "bGL canvas..."` reads
#     as `We` at the join because the whole word already sits untouched inside
#     the first literal). `ts-concat-first-person` instead requires the join
#     to land inside the word's own letters -- one alternative per internal
#     split point (`w`|`e`, `o`|`ur`, `ou`|`r`, and `let's`'s four splits),
#     mandatory at that position and optional elsewhere -- so a word whole in
#     one literal never matches (no join exists inside it to require) while a
#     genuine split at any position still does. Verified against the cited
#     false positive and every tracked `.ts`/`.tsx` file (zero matches) and
#     against a constructed genuine split at every internal position of each
#     word (each fires).
#
#     What stays open even after this: any string built by something other
#     than a literal-literal `concat!`/`+` chain -- `format!`, `.push_str`, a
#     TypeScript `+=` accumulation, array `.join("")`, a template literal
#     built from separately-named `const` fragments referenced once each, or
#     the equivalent in another language's string-building API -- reassembles
#     the same way and this file cannot see any of it (verified against
#     #1363's own three fixtures: all three scan clean). Closing that needs
#     evaluating the program, not matching its text; a human reading the diff
#     is the only gate for it, same as for the arbitrary Turing-complete
#     cases this file's other rules cannot see either (#1287).
#
# `.proto` gets the comment checks only, `languages: [generic]` with
# `paths.include` scoped to `/proto/**/*.proto` -- semgrep has no first-class
# proto language, same posture as `.semgrep.yml`'s
# `proto-money-field-uses-float`. No string-literal rules: a `.proto` message
# carries field declarations, not reader-facing string copy, so the
# string-literal patterns above would never match. First-person plural is
# also skipped here for the reason it is skipped in Rust/TypeScript comments
# above -- proto comments reason about the wire, they do not address a
# reader.
#
# Markdown (`md-*`, `languages: [generic]`, `paths.include: "*.md"`) was
# entirely ungated before this: 152 tracked files, the largest body of
# human-read prose in the tree, including `AGENTS.md` and
# `docs/CODING-STANDARD.md` themselves. Every `md-*` rule shares one
# span-selector prefix instead of the two-pattern container/content split
# above, because markdown mixes prose with quoted material on the same line
# in a way source code does not:
#
#   (?m)^(?:[^`"\n]|`[^`\n]*`|"[^"\n]*")*?\b(WORDS)\b
#
# Read left to right: from a line's start, skip a complete backtick code
# span or a complete same-line double-quoted span as one atomic unit
# (whichever opens first), or skip one plain character, repeated lazily,
# until a banned word surfaces outside both. This closes two real sources of
# false positives, both measured on this tree rather than assumed:
#   - Inline code. `` `just check` `` reads as code, not prose, the same
#     reason the Rust/TS rules above never scan an identifier. Measured:
#     conformance docs alone reference `just <recipe>` 110 times in inline
#     code, plus roughly 25 more as a bare shell-example line inside a
#     fenced block with no per-line backticks at all -- see the
#     `md-hedge-just` note below for that second shape.
#   - Vendor text quoted inline. A conformance doc's whole purpose is
#     quoting a venue or vendor verbatim (`docs/VOICE.md` § Documentation's
#     own provenance exception), and vendor prose was not written to this
#     standard: `finance/docs/conformance/lighter.md` and `risex.md` quote
#     terms-of-service text reading "We do not collect..." and "...our
#     customers", `deribit.md` quotes a Deribit article saying "just the
#     amount you would pay". Rewriting a quotation to satisfy this file's
#     own banned-word list would misquote the source, which is worse.
#     Measured limitation: the pairing only tracks a quote opened and closed
#     on the *same* line, so a quotation that wraps across lines (as all
#     three cited cases do) leaves an unpaired `"` that the prefix cannot
#     step over, which happens to also stop the match rather than exposing
#     the banned word on the far side of the break -- verified against all
#     three cases and against every real `+`-free line in the tree, zero
#     false negatives introduced (no non-quoted banned word shares a line
#     with an unrelated unclosed quote here). A vendor quotation that both
#     opens and closes on one line and contains its own two-line-spanning
#     inner quote is not something this measurement found and is not
#     something this pattern can be trusted against.
#
# A markdown blockquote (a line starting `>`) is a second, more consistent
# vendor-text shape particular to the conformance docs -- `coinalyze.md`,
# `okx.md`, `godel.md` and `extended/SOURCES.md` all use one to cite a
# vendor's docs or terms verbatim, unquoted-inline because the citation runs
# several lines. Every `md-*` rule excludes it with a second span-selector
# clause, `(?!>)`, checked once per line same as the pairing prefix.
#
# Per-word exclusions, each measured the same way §1's header measures
# `clean`/`surface` for Rust and TypeScript -- by reading every tree-wide hit
# before deciding, not by assumption:
#   - `smart` is dropped from `md-figurative`. Every real hit is domain
#     jargon: "smart contract" (`hibachi.md`, `aster.md`) is blockchain
#     terminology, "Smart Money"/"Smart-Money" (`nansen.md`) is Nansen's own
#     label for an address cohort, named because that is what the vendor
#     calls it. Zero hits were the banned marketing adjective.
#   - `enables` is dropped from `md-purpose-verb`. Every real hit describes
#     a Cargo feature flag or a MinIO API call turning a specific thing on
#     (`rustls-tls-webpki-roots` enabling a TLS backend, `minio-init`
#     enabling bucket versioning) -- Cargo's own book uses "enables" this
#     way for feature unification. Zero hits addressed a reader's benefit.
#   - `yet` and `currently` are not in `md-temporal-filler`, matching the
#     Rust/TS exclusion above and for the same measured reason: conformance
#     docs quote a venue's own error strings ("not currently listed for
#     trading") and ordinary unrelated prose ("has not shipped yet") far
#     more often than the banned filler sense. `right now`/`at the moment`
#     stayed precise enough to keep: every real hit found was the banned
#     sense, and both were rewritten.
#   - `md-first-person` (`we`/`our`) additionally excludes
#     `finance/docs/conformance/**`: three of this tree's five real hits are
#     the cross-line vendor quotations the pairing prefix cannot reach
#     (above); the other two are blockquotes already excluded by `(?!>)`.
#     No hit in this directory was this tree's own voice, so the directory
#     carries no gate coverage loss today, but a future author's own
#     first-person sentence in a conformance doc would not be caught by this
#     rule -- `docs/CODING-STANDARD.md`'s enforcement table records this as
#     `review` there, `gate` everywhere else in `*.md`. `let's` had zero
#     hits tree-wide and needed no exclusion.
#   - `docs/VOICE.md` itself is excluded (`paths.exclude`) from
#     `md-figurative`, `md-purpose-verb`, `md-hedge`, `md-hedge-just` and
#     `md-first-person` -- never from `md-temporal-filler`, which needs no
#     exclusion at all. VOICE.md's own "Banned outright" section quotes
#     every word these rules ban, in order to ban it: `_at a glance, under
#     the hood, ..., north star._`, `_helps you, lets you, ..., built to._`,
#     `_simply, just, ..., it should be noted._`, and `No _we_, no _our_, no
#     _let's_.` -- four italic, comma-separated lists the pairing prefix
#     does not reach, because markdown italics are not a quote or a code
#     span. This is the one exclusion in this file scoped to a single
#     document rather than a directory or a word, because it is the one
#     document in this repository whose entire job is to name these words.
#     Read in full before choosing this: every other banned-word mention in
#     VOICE.md sits inside a backtick span or a table cell already covered
#     by the pairing prefix above (the "Hard limits" § "Cut every word that
#     is not the fact" table, `` `right now` ``, `` `Oops! Something went
#     wrong.` ``) -- the four bullets are the only passages that needed a
#     wider exclusion, so the exclusion is scoped no wider than that: this
#     file, these five rules, nothing else in `*.md`.
#
# `md-hedge-just` is `just` split out of `md-hedge` because it alone needed
# a fenced-code exclusion the other fifteen hedge words measured as not
# needing (zero of their real hits were inside a fence). A fenced ` ```sh `
# block's content is not inline-backtick-wrapped line by line, so the
# pairing prefix above does not see it as code -- but every real fenced
# example measured here (`just check       # pre-push`, `just adopt-scan
# ./NAME-VERSION`, ~25 sites) puts `just` as the line's first word, so
# `md-hedge-just` adds `(?!\s*just\b)` to the span selector: a line cannot
# be a shell example unless the recipe name leads it, and no genuine hedge
# sentence measured here opens a line with "just" (every real hit was
# mid-sentence, e.g. "not just X"). Seventeen real hits were found this way,
# tree-wide, past both exclusions, and all seventeen were rewritten to state
# the fact without the hedge (`not just X` to `not X alone` or `not only
# X`, `at or just below` to `at or immediately below`) rather than excluded.
#
# No markdown exclamation-mark rule exists, matching the Rust/TS/Swift
# decision above and for the same reason, re-measured for `*.md`
# specifically: of 90 raw `!` occurrences, 11 are markdown's own image
# syntax `![alt]`, and virtually all the rest are Rust macro invocations
# quoted in docs (`println!`, `venues!`, `register!`, `panic!`,
# `tracing::error!`), boolean negation (`!is_retryable`, `!v.is_empty()`),
# an HTML comment (`<!--`), or a Tailwind `!important` mention -- the same
# shapes the header above found for source code, not the banned
# punctuation. `docs/VOICE.md`'s own `` `Oops! Something went wrong.` ``
# example is backtick-wrapped and would be excluded by the pairing prefix
# regardless.

rules:
  - id: rust-string-figurative
    languages: [rust]
    severity: ERROR
    message: >-
      Figurative language in a string literal. VOICE.md § Banned outright: it
      does not resolve literally, so a literal reader stalls on it. Say what
      the thing is.
    patterns:
      - pattern-regex: '"(?:[^"\\\n]|\\.)*"'
      - pattern-regex: "(?i)\\b(at a glance|under the hood|drill down|deep dive|unlock|powerful|seamless|robust|rich|smart|intuitive|elegant|first-class|out of the box|heavy lifting|source of truth|north star)\\b"

  - id: rust-string-purpose-verb
    languages: [rust]
    severity: ERROR
    message: >-
      A purpose verb in a string literal. VOICE.md § Banned outright: say what
      a thing is, never what it does for the reader.
    patterns:
      - pattern-regex: '"(?:[^"\\\n]|\\.)*"'
      - pattern-regex: "(?i)\\b(helps you|lets you|allows you to|enables|makes it easy to|so you can|designed to|built to)\\b"

  - id: rust-string-hedge
    languages: [rust]
    severity: ERROR
    message: >-
      A hedge or filler word in a string literal. VOICE.md § Banned outright:
      cut every word that is not the fact.
    patterns:
      - pattern-regex: '"(?:[^"\\\n]|\\.)*"'
      - pattern-regex: "(?i)\\b(simply|just|essentially|basically|actually|really|quite|fairly|generally|typically|various|appropriate|as needed|please note|of course|note that|in order to|it should be noted)\\b"

  - id: rust-string-first-person
    languages: [rust]
    severity: ERROR
    message: >-
      First person plural in a string literal. VOICE.md § Banned outright: no
      we, no our, no let's.
    patterns:
      - pattern-regex: '"(?:[^"\\\n]|\\.)*"'
      - pattern-regex: "(?i)\\b(we|our|let's)\\b"

  - id: rust-comment-figurative
    languages: [rust]
    severity: ERROR
    message: >-
      Figurative language in a comment. VOICE.md § Banned outright applies to
      everything a human reads, comments included.
    paths:
      exclude:
        - "**/gen/**"
    patterns:
      - pattern-regex: '(?:^[ \t]*///?[^\n]*\n)+[ \t]*[^\n]*\n'
      - pattern-regex: "(?i)\\b(at a glance|under the hood|drill down|deep dive|unlock|powerful|seamless|robust|rich|smart|intuitive|elegant|first-class|out of the box|heavy lifting|source of truth|north star)\\b"

  - id: rust-comment-purpose-verb
    languages: [rust]
    severity: ERROR
    message: >-
      A purpose verb in a comment. VOICE.md § Banned outright applies to
      everything a human reads, comments included.
    paths:
      exclude:
        - "**/gen/**"
    patterns:
      - pattern-regex: '(?:^[ \t]*///?[^\n]*\n)+[ \t]*[^\n]*\n'
      - pattern-regex: "(?i)\\b(helps you|lets you|allows you to|enables|makes it easy to|so you can|designed to|built to)\\b"

  - id: rust-comment-hedge
    languages: [rust]
    severity: ERROR
    message: >-
      A hedge or filler word in a comment. VOICE.md § Banned outright applies
      to everything a human reads, comments included.
    paths:
      exclude:
        - "**/gen/**"
    patterns:
      - pattern-regex: '(?:^[ \t]*///?[^\n]*\n)+[ \t]*[^\n]*\n'
      - pattern-regex: "(?i)\\b(simply|just|essentially|basically|actually|really|quite|fairly|generally|typically|various|appropriate|as needed|please note|of course|note that|in order to|it should be noted)\\b"

  - id: ts-string-figurative
    languages: [typescript]
    severity: ERROR
    message: >-
      Figurative language in a string or template literal. VOICE.md § Banned
      outright: it does not resolve literally, so a literal reader stalls on
      it.
    paths:
      exclude:
        - "**/gen/**"
    patterns:
      - pattern-regex: '(?:"(?:[^"\\\n]|\\.)*"|`(?:[^`\\]|\\.)*`|''(?:[^''\\\n]|\\.)*'')'
      - pattern-regex: "(?i)\\b(at a glance|under the hood|drill down|deep dive|unlock|powerful|seamless|robust|rich|smart|intuitive|elegant|first-class|out of the box|heavy lifting|source of truth|north star)\\b"

  - id: ts-string-purpose-verb
    languages: [typescript]
