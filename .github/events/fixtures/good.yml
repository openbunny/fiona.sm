name: good
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
concurrency:
  group: good-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: echo "hello"
