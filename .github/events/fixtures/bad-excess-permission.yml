name: bad-excess-permission
on:
  pull_request:
concurrency:
  group: bad-excess-permission-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  id-token: write
jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: echo "hello"
