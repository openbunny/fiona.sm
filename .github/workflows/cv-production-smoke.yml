name: cv production smoke
on:
  push:
    branches: [main]
    paths:
      - "public/cv.pdf"
      - "public/_redirects"
      - "lib/site/route-headers.ts"
      - "lib/site/cloudflare-headers.ts"
      - ".github/workflows/cv-production-smoke.yml"
  workflow_dispatch:
permissions: {}
concurrency:
  group: cv-production-smoke
  cancel-in-progress: true
jobs:
  verify:
    name: verify production cv
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify published PDF and observable routes
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sha256sum public/cv.pdf | cut -d ' ' -f1)"
          verified=false
          for attempt in $(seq 1 36); do
            if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' -D "$RUNNER_TEMP/direct.headers" -o "$RUNNER_TEMP/direct.pdf" "https://fiona.sm/cv.pdf?commit=$GITHUB_SHA&attempt=$attempt" &&
              grep -Eiq '^content-type:[[:space:]]*application/pdf' "$RUNNER_TEMP/direct.headers" &&
              grep -Eiq '^content-disposition:[[:space:]]*inline' "$RUNNER_TEMP/direct.headers" &&
              [[ "$(sha256sum "$RUNNER_TEMP/direct.pdf" | cut -d ' ' -f1)" == "$expected" ]]; then
              verified=true
              break
            fi
            sleep 10
          done
          if [[ "$verified" != true ]]; then
            echo "Production PDF is not available inline with the expected SHA-256" >&2
            exit 1
          fi
          for path in /cv /resume /CV; do
            status="$(curl -sS --max-time 20 -D "$RUNNER_TEMP/route.headers" -o "$RUNNER_TEMP/route.body" -w '%{http_code}' "https://fiona.sm$path")"
            if [[ "$status" == 403 ]] &&
              grep -Eiq '^cf-mitigated:[[:space:]]*challenge' "$RUNNER_TEMP/route.headers"; then
              echo "::warning::Cloudflare WAF challenged the GitHub runner on $path; route behavior must be checked from an ordinary browser"
              continue
            fi
            if [[ "$path" == /cv ]]; then
              if [[ "$status" != 200 ]] ||
                ! grep -Eiq '^content-type:[[:space:]]*application/pdf' "$RUNNER_TEMP/route.headers" ||
                ! grep -Eiq '^content-disposition:[[:space:]]*inline' "$RUNNER_TEMP/route.headers" ||
                [[ "$(sha256sum "$RUNNER_TEMP/route.body" | cut -d ' ' -f1)" != "$expected" ]]; then
                echo "Unexpected response from /cv: HTTP $status" >&2
                exit 1
              fi
            elif [[ "$status" != 308 ]] ||
              ! grep -Eiq '^location:[[:space:]]*(https://fiona\.sm)?/cv[[:space:]]*$' "$RUNNER_TEMP/route.headers"; then
              echo "Unexpected redirect from $path: HTTP $status" >&2
              exit 1
            fi
          done
