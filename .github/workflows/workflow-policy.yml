name: workflow policy
on:
  pull_request:
    paths:
      - ".github/**"
  push:
    branches: [main]
    paths:
      - ".github/**"
  merge_group:
  workflow_dispatch:
concurrency:
  group: workflow-policy-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  policy:
    name: policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: "2026.9.15"
          cache: false
          install_args: --locked
      - run: just actions-check
      - run: just actions-pin-verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
