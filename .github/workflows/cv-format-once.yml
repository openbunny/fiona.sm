name: cv format once
on:
  push:
    branches:
      - feat/native-cv-page-20261122
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write app/cv/page.tsx
      - name: commit formatting
        run: |
          git config user.name fiona
          git config user.email bot@fiona.sm
          git add app/cv/page.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(cv): apply prettier formatting" -m "Signed-off-by: fiona <bot@fiona.sm>"
            git push origin HEAD:feat/native-cv-page-20261122
          fi
